display_information:
  name: Heinlein
  description: Two-way control plane for Lars's writing pipeline
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Heinlein
    always_online: true
  slash_commands:
    - command: /heinlein
      description: "status | post <repo path> | tick"
      usage_hint: "status"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - reactions:read
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
