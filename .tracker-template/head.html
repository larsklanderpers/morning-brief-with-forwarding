<!DOCTYPE html><script type="application/json" id="cowork-artifact-meta">
{
  "name": "Brief Tracker Daily",
  "schemaVersion": 1,
  "description": "Daily reading tracker for the Cybersecurity, AI, and AI Work morning briefs. Rebuilt each morning by the brief-tracker-rebuild scheduled task from the day's brief files. Checkboxes, progress bars, and read state persist per day in localStorage."
}
</script>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brief Tracker — July 10, 2026</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --text-muted: #718096;
      --green: #276749;
      --progress-bg: #e2e8f0;
      --read-opacity: 0.42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    /* HEADER */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .date-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    h1 { font-size: 16px; font-weight: 700; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .btn-sm {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-sm:hover { background: #f0f0f0; }
    .btn-sm.reset { color: #e53e3e; border-color: #fed7d7; }
    .btn-sm.reset:hover { background: #fff5f5; }

    /* PROGRESS */
    .progress-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .prog { flex: 1; min-width: 120px; }
    .prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .prog-label .done { color: var(--green); }
    .prog-bar {
      height: 5px;
      background: var(--progress-bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.35s cubic-bezier(.4,0,.2,1);
    }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 18px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      color: var(--text-muted);
      transition: color 0.15s;
      user-select: none;
    }
    .tab:hover:not(.active) { color: var(--text); }

    /* PANEL */
    .panel { display: none; padding: 14px 18px 32px; }
    .panel.active { display: block; }
    .empty-note {
      text-align: center;
      padding: 28px 20px;
      color: var(--text-muted);
      font-size: 12px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    /* SECTION */
    .section { margin-bottom: 18px; }
    .section-hdr {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .section-hdr:hover .section-title { color: var(--text); }
    .section-title {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      flex: 1;
      transition: color 0.15s;
    }
    .section-meta {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .section-meta.done { color: var(--green); }
    .chevron {
      font-size: 9px;
      color: var(--text-muted);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .section.collapsed .chevron { transform: rotate(-90deg); }
    .section.collapsed .items { display: none; }
    .items { display: flex; flex-direction: column; gap: 6px; }

    /* ITEM */
    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 0.15s, opacity 0.25s;
    }
    .item:hover { border-color: #a0aec0; }
    .item.read { opacity: var(--read-opacity); }
    .item.read .item-title { text-decoration: line-through; text-decoration-color: #a0aec0; }

    /* CHECKBOX */
    .cb {
      width: 15px; height: 15px;
      border: 1.5px solid #cbd5e0;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px;
      transition: all 0.15s;
      background: var(--surface);
      color: transparent;
    }
    .item.read .cb {
      background: #48bb78;
      border-color: #48bb78;
      color: white;
    }

    /* ITEM CONTENT */
    .item-body { flex: 1; min-width: 0; }
    .item-meta-row {
      display: flex; align-items: center; gap: 5px; margin-bottom: 2px; flex-wrap: wrap;
    }
    .tag {
      font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 1px 5px; border-radius: 3px;
      white-space: nowrap;
    }
    .tag-default  { background: #edf2f7; color: #4a5568; }
    .tag-gov      { background: #fff5f5; color: #c53030; }
    .tag-cve      { background: #fffaf0; color: #c05621; }
    .tag-breach   { background: #fff5f5; color: #9b2c2c; }
    .tag-ai       { background: #ebf8ff; color: #2b6cb0; }
    .tag-signal   { background: #f0fff4; color: #276749; }
    .tag-community{ background: #faf5ff; color: #6b46c1; }
    .tag-frontier { background: #ebf8ff; color: #2c5282; }
    .tag-privacy  { background: #fff5f5; color: #9b2c2c; }
    .tag-local    { background: #f0fff4; color: #276749; }
    .tag-ecosystem{ background: #faf5ff; color: #553c9a; }
    .tag-shipping { background: #fffff0; color: #975a16; }
    .tag-pii      { background: #fed7d7; color: #9b2c2c; }
    .tag-role     { background: #ebf8ff; color: #2c5282; }
    .tag-youtube  { background: #fff5f5; color: #c53030; }
    .tag-debate   { background: #edf2f7; color: #4a5568; }

    .item-source { font-size: 10px; color: var(--text-muted); }
    .item-title { font-size: 12px; font-weight: 700; line-height: 1.35; margin-bottom: 2px; color: var(--text); }
    .item-summary { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

    /* ALL DONE BANNER */
    .all-done-banner {
      display: none;
      text-align: center;
      padding: 20px;
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #276749;
    }
    .all-done-banner.show { display: block; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="date-label" id="date-label"></div>
      <h1>🛡️ Morning Briefs</h1>
    </div>
    <div class="header-actions">
      <button class="btn-sm" onclick="markAllRead()">Mark all read</button>
      <button class="btn-sm reset" onclick="resetAll()">Reset</button>
    </div>
  </div>
  <div class="progress-row" id="progress-row"></div>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>
